<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greenhouse Finance & Garden</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.com/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pastel: {
              50: '#f4fbf6',
              100: '#e8f7ec',
              200: '#c8eed3',
              300: '#9ee0b1',
              400: '#6ecb8a',
              500: '#47b067',
              600: '#34904f',
              700: '#2b7341',
              800: '#255b37',
              900: '#204b2f',
              950: '#0e2918',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Falling Leaves Canvas Setup */
    #leafCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .glass {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .dark .glass {
      background: rgba(15, 30, 20, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
    }
    .animate-float { animation: float 3.5s ease-in-out infinite; }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 15px rgba(158, 224, 177, 0.6)); }
      50% { opacity: 0.8; filter: drop-shadow(0 0 25px rgba(110, 203, 138, 0.9)); }
    }
    .ambient-light { animation: pulse-glow 6s ease-in-out infinite; }
  </style>
</head>
<body class="bg-pastel-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-500 font-sans pb-12 relative overflow-x-hidden">

  <!-- Leaf Canvas for Background Animation -->
  <canvas id="leafCanvas"></canvas>

  <!-- Content Layer -->
  <div class="relative z-10">
    <!-- Header & Mode Switcher -->
    <header class="p-5 max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="p-2 rounded-2xl bg-pastel-200 dark:bg-pastel-900/60 text-pastel-800 dark:text-pastel-300 shadow-sm">
          <i data-lucide="flower-2" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide text-pastel-900 dark:text-pastel-200 leading-tight">Greenhouse Space</h1>
          <p class="text-xs text-pastel-700 dark:text-pastel-400 font-medium">Suasana Rumah Kaca & Tabungan Terraria</p>
        </div>
      </div>
      <button id="themeToggle" class="glass p-3 rounded-2xl shadow-sm hover:scale-105 transition-all text-pastel-800 dark:text-pastel-300">
        <i data-lucide="moon" id="themeIcon" class="w-5 h-5"></i>
      </button>
    </header>

    <main class="max-w-4xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- Garden Showcase (Interactive Game Area) -->
      <section class="md:col-span-3 glass rounded-3xl p-6 text-center relative overflow-hidden shadow-xl border border-pastel-200/60 dark:border-pastel-900/40">
        <div class="absolute top-4 right-4 flex gap-2 z-20">
          <button onclick="toggleTryOn()" class="text-xs bg-pastel-200/80 hover:bg-pastel-300 dark:bg-pastel-900/80 dark:hover:bg-pastel-800 text-pastel-900 dark:text-pastel-100 px-3.5 py-2 rounded-full font-semibold transition backdrop-blur-sm shadow-sm flex items-center gap-1.5">
            <i data-lucide="eye" class="w-3.5 h-3.5"></i> Try On Bunga
          </button>
        </div>

        <span class="inline-block px-3 py-1 bg-pastel-200/60 dark:bg-pastel-900/50 text-pastel-800 dark:text-pastel-300 text-xs font-bold tracking-wider uppercase rounded-full mb-2">
          🏡 Greenhouse Sanctuary
        </span>
        <h2 class="text-xl font-extrabold text-pastel-950 dark:text-pastel-100 mb-4">Taman Bunga Saya</h2>

        <!-- Selector Jenis Bunga -->
        <div class="flex justify-center gap-3 mb-6">
          <button onclick="setFlowerType('mawar')" id="btnMawar" class="px-5 py-2 rounded-2xl text-sm font-semibold border transition-all duration-300 flex items-center gap-2">
            <span>🌹</span> Mawar
          </button>
          <button onclick="setFlowerType('matahari')" id="btnMatahari" class="px-5 py-2 rounded-2xl text-sm font-semibold border transition-all duration-300 flex items-center gap-2">
            <span>🌻</span> Matahari
          </button>
        </div>

        <!-- Pot & Visual Bunga -->
        <div class="h-48 flex flex-col justify-end items-center my-2 relative">
          <!-- Light glow effect behind flower -->
          <div class="absolute w-32 h-32 rounded-full bg-pastel-300/40 dark:bg-pastel-500/20 ambient-light bottom-6"></div>
          
          <div id="flowerVisual" class="text-7xl animate-float transition-all duration-500 z-10 drop-shadow-md">🌱</div>
          <div class="text-5xl -mt-3 z-10 drop-shadow-sm">🪴</div>
        </div>

        <p id="flowerStageText" class="text-sm font-semibold text-pastel-900 dark:text-pastel-200 mt-3">
          Tahap: Benih (Rp 0 - Rp 9.999)
        </p>

        <!-- Try On Control Bar -->
        <div id="tryOnBar" class="hidden mt-5 pt-4 border-t border-pastel-200/50 dark:border-pastel-900/50 flex flex-wrap justify-center items-center gap-2 text-xs">
          <span class="font-bold text-pastel-900 dark:text-pastel-300 mr-1">Simulasi Level:</span>
          <button onclick="previewStage(0)" class="px-3 py-1.5 bg-white/80 dark:bg-slate-800 rounded-xl hover:bg-pastel-200 dark:hover:bg-pastel-900 transition font-medium">0 (Benih)</button>
          <button onclick="previewStage(1)" class="px-3 py-1.5 bg-white/80 dark:bg-slate-800 rounded-xl hover:bg-pastel-200 dark:hover:bg-pastel-900 transition font-medium">1 (Tunas)</button>
          <button onclick="previewStage(2)" class="px-3 py-1.5 bg-white/80 dark:bg-slate-800 rounded-xl hover:bg-pastel-200 dark:hover:bg-pastel-900 transition font-medium">2 (Kuncup)</button>
          <button onclick="previewStage(3)" class="px-3 py-1.5 bg-white/80 dark:bg-slate-800 rounded-xl hover:bg-pastel-200 dark:hover:bg-pastel-900 transition font-medium">3 (Mekar)</button>
          <button onclick="resetPreview()" class="px-3 py-1.5 bg-rose-100 text-rose-700 dark:bg-rose-950/50 dark:text-rose-300 rounded-xl font-semibold hover:bg-rose-200 transition">Reset</button>
        </div>
      </section>

      <!-- Ringkasan Saldo & Target -->
      <section class="glass p-6 rounded-3xl shadow-lg border border-pastel-200/60 dark:border-pastel-900/40">
        <p class="text-xs text-pastel-700 dark:text-pastel-400 font-bold uppercase tracking-wider">Total Tabungan</p>
        <h3 id="savingsDisplay" class="text-3xl font-black text-pastel-900 dark:text-pastel-200 mt-1">Rp 0</h3>
        
        <div class="mt-5">
          <div class="flex justify-between text-xs font-semibold mb-1.5 text-slate-600 dark:text-slate-300">
            <span>Target Berikutnya (+10k)</span>
            <span id="targetPercent" class="text-pastel-800 dark:text-pastel-300 font-extrabold">0%</span>
          </div>
          <div class="w-full bg-pastel-200/70 dark:bg-slate-800 h-3 rounded-full overflow-hidden p-0.5">
            <div id="progressBar" class="bg-gradient-to-r from-pastel-400 to-pastel-600 h-full w-0% rounded-full transition-all duration-500"></div>
          </div>
        </div>
      </section>

      <!-- Form Transaksi -->
      <section class="glass p-6 rounded-3xl shadow-lg border border-pastel-200/60 dark:border-pastel-900/40 md:col-span-2">
        <h3 class="text-base font-bold mb-4 flex items-center gap-2 text-pastel-950 dark:text-pastel-100">
          <i data-lucide="plus-circle" class="w-5 h-5 text-pastel-600 dark:text-pastel-400"></i> Catat Keuangan
        </h3>
        <form id="financeForm" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <select id="typeInput" class="p-3 rounded-2xl border border-pastel-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 text-sm font-medium focus:ring-2 focus:ring-pastel-500 outline-none">
            <option value="nabung">🟢 Tabungan (+)</option>
            <option value="pemasukan">📥 Pemasukan (+)</option>
            <option value="pengeluaran">📤 Pengeluaran (-)</option>
          </select>
          <input type="number" id="amountInput" placeholder="Jumlah (Rp)" required class="p-3 rounded-2xl border border-pastel-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 text-sm font-medium focus:ring-2 focus:ring-pastel-500 outline-none">
          <button type="submit" class="bg-pastel-600 hover:bg-pastel-700 dark:bg-pastel-500 dark:hover:bg-pastel-400 text-white dark:text-slate-950 font-bold p-3 rounded-2xl text-sm transition shadow-md hover:shadow-lg flex items-center justify-center gap-2">
            <span>Simpan</span>
            <i data-lucide="check" class="w-4 h-4"></i>
          </button>
        </form>
      </section>

      <!-- Chart & Filter Periode -->
      <section class="glass p-6 rounded-3xl shadow-lg border border-pastel-200/60 dark:border-pastel-900/40 md:col-span-3">
        <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
          <h3 class="text-base font-bold flex items-center gap-2 text-pastel-950 dark:text-pastel-100">
            <i data-lucide="line-chart" class="w-5 h-5 text-pastel-600 dark:text-pastel-400"></i> Grafik Keuangan
          </h3>
          <div class="flex gap-1.5 text-xs bg-pastel-200/60 dark:bg-slate-800 p-1 rounded-2xl">
            <button onclick="updateFilter('hari')" id="btnHari" class="px-3 py-1.5 rounded-xl font-bold bg-pastel-500 text-white shadow-sm transition">Hari</button>
            <button onclick="updateFilter('bulan')" id="btnBulan" class="px-3 py-1.5 rounded-xl font-semibold text-slate-600 dark:text-slate-300 hover:text-pastel-900 transition">Bulan</button>
            <button onclick="updateFilter('tahun')" id="btnTahun" class="px-3 py-1.5 rounded-xl font-semibold text-slate-600 dark:text-slate-300 hover:text-pastel-900 transition">Tahun</button>
          </div>
        </div>
        <div class="h-52 w-full">
          <canvas id="financeChart"></canvas>
        </div>
      </section>

    </main>
  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Dark Mode Toggle Logic
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      lucide.createIcons();
      renderChart();
    });

    // Background Canvas Animated Falling Leaves
    const canvas = document.getElementById('leafCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Leaf {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = -20 - Math.random() * 50;
        this.size = 8 + Math.random() * 12;
        this.speedY = 0.5 + Math.random() * 1.2;
        this.speedX = Math.sin(Math.random() * Math.PI * 2) * 0.5;
        this.angle = Math.random() * Math.PI * 2;
        this.spinSpeed = (Math.random() - 0.5) * 0.03;
        this.opacity = 0.3 + Math.random() * 0.5;
        this.hue = 120 + Math.random() * 40; // Pastel greens
        this.saturation = 35 + Math.random() * 30;
        this.lightness = 45 + Math.random() * 25;
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.015) * 0.8 + this.speedX;
        this.angle += this.spinSpeed;

        if (this.y > canvas.height + 20 || this.x < -20 || this.x > canvas.width + 20) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = this.opacity;

        const isDark = document.documentElement.classList.contains('dark');
        const lightness = isDark ? this.lightness + 10 : this.lightness;
        ctx.fillStyle = `hsl(${this.hue}, ${this.saturation}%, ${lightness}%)`;

        // Draw leaf shape
        ctx.beginPath();
        ctx.moveTo(0, -this.size);
        ctx.quadraticCurveTo(this.size * 0.6, -this.size * 0.2, 0, this.size);
        ctx.quadraticCurveTo(-this.size * 0.6, -this.size * 0.2, 0, -this.size);
        ctx.fill();

        // Leaf vein line
        ctx.strokeStyle = `hsl(${this.hue}, ${this.saturation}%, ${lightness - 15}%)`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -this.size * 0.8);
        ctx.lineTo(0, this.size * 0.8);
        ctx.stroke();

        ctx.restore();
      }
    }

    const leaves = Array.from({ length: 35 }, () => new Leaf());

    function animateLeaves() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      leaves.forEach(leaf => {
        leaf.update();
        leaf.draw();
      });
      requestAnimationFrame(animateLeaves);
    }
    animateLeaves();

    // App State & Local Storage Logic
    let transactions = JSON.parse(localStorage.getItem('gh_transactions')) || [];
    let selectedFlower = localStorage.getItem('gh_flower') || 'mawar';

    const stages = {
      mawar: ['🌱', '🌿', '🪻', '🌹'],
      matahari: ['🌱', '🌿', '☘️', '🌻']
    };

    const stageNames = ['Benih', 'Tunas', 'Kuncup', 'Mekar Sempurna'];

    function calculateSavings() {
      return transactions.reduce((acc, curr) => {
        if (curr.type === 'nabung') return acc + curr.amount;
        return acc;
      }, 0);
    }

    function updateGardenUI(previewLevel = null) {
      const savings = calculateSavings();
      const actualLevel = Math.min(Math.floor(savings / 10000), 3);
      const activeLevel = previewLevel !== null ? previewLevel : actualLevel;

      document.getElementById('flowerVisual').innerText = stages[selectedFlower][activeLevel];
      document.getElementById('flowerStageText').innerText = 
        `Tahap: ${stageNames[activeLevel]} (Level ${activeLevel})`;

      document.getElementById('savingsDisplay').innerText = `Rp ${savings.toLocaleString('id-ID')}`;
      
      const currentTierProgress = (savings % 10000) / 10000 * 100;
      const progressPercent = actualLevel >= 3 ? 100 : Math.round(currentTierProgress);
      
      document.getElementById('progressBar').style.width = `${progressPercent}%`;
      document.getElementById('targetPercent').innerText = `${progressPercent}%`;
    }

    function setFlowerType(type) {
      selectedFlower = type;
      localStorage.setItem('gh_flower', type);
      
      const activeClass = "px-5 py-2 rounded-2xl text-sm font-semibold border bg-pastel-500 text-white border-pastel-500 shadow-md transition-all duration-300 flex items-center gap-2";
      const inactiveClass = "px-5 py-2 rounded-2xl text-sm font-semibold border border-pastel-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:bg-pastel-100 dark:hover:bg-slate-900 transition-all duration-300 flex items-center gap-2";

      document.getElementById('btnMawar').className = type === 'mawar' ? activeClass : inactiveClass;
      document.getElementById('btnMatahari').className = type === 'matahari' ? activeClass : inactiveClass;
      updateGardenUI();
    }

    function toggleTryOn() {
      document.getElementById('tryOnBar').classList.toggle('hidden');
    }
    function previewStage(lvl) { updateGardenUI(lvl); }
    function resetPreview() { updateGardenUI(); }

    // Form Submit
    document.getElementById('financeForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const type = document.getElementById('typeInput').value;
      const amount = parseFloat(document.getElementById('amountInput').value);

      if (!amount || amount <= 0) return;

      transactions.push({ type, amount, date: new Date().toISOString() });
      localStorage.setItem('gh_transactions', JSON.stringify(transactions));
      
      document.getElementById('amountInput').value = '';
      updateGardenUI();
      renderChart();
    });

    // Chart.js Rendering
    let chartInstance = null;
    function renderChart() {
      const ctx = document.getElementById('financeChart').getContext('2d');
      const savings = calculateSavings();
      const isDark = document.documentElement.classList.contains('dark');

      if (chartInstance) chartInstance.destroy();

      const gridColor = isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.06)';
      const textColor = isDark ? '#cbd5e1' : '#475569';

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['Mulai', 'Target Rp10k', 'Target Rp20k', 'Target Rp30k (Max)'],
          datasets: [{
            label: 'Total Tabungan (Rp)',
            data: [0, Math.min(savings, 10000), Math.min(savings, 20000), savings],
            borderColor: '#47b067',
            backgroundColor: isDark ? 'rgba(71, 176, 103, 0.15)' : 'rgba(71, 176, 103, 0.25)',
            borderWidth: 3,
            fill: true,
            tension: 0.35,
            pointBackgroundColor: '#255b37',
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { 
              beginAtZero: true, 
              grid: { color: gridColor },
              ticks: { color: textColor, font: { family: 'sans-serif', size: 11 } }
            },
            x: { 
              grid: { display: false },
              ticks: { color: textColor, font: { family: 'sans-serif', size: 11 } }
            }
          }
        }
      });
    }

    function updateFilter(period) {
      ['Hari', 'Bulan', 'Tahun'].forEach(p => {
        const btn = document.getElementById(`btn${p}`);
        if (p.toLowerCase() === period) {
          btn.className = "px-3 py-1.5 rounded-xl font-bold bg-pastel-500 text-white shadow-sm transition";
        } else {
          btn.className = "px-3 py-1.5 rounded-xl font-semibold text-slate-600 dark:text-slate-300 hover:text-pastel-900 transition";
        }
      });
    }

    // Initial Load
    setFlowerType(selectedFlower);
    renderChart();
  </script>
</body>
</html>
